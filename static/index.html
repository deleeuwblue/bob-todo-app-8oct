<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f7f8fa;
      color: #1f2328;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #1f2328;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .add-form input[type="text"] {
      flex: 2;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
      color: #1f2328;
      outline: none;
      transition: border-color 0.15s;
    }

    .add-form input[type="date"] {
      flex: 1;
      min-width: 140px;
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      background: #fff;
      color: #1f2328;
      outline: none;
      transition: border-color 0.15s;
    }

    .add-form input:focus {
      border-color: #3b82d4;
    }

    .add-form button {
      padding: 10px 20px;
      background: #3b82d4;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .add-form button:hover { background: #2f6db8; }
    .add-form button:active { background: #265d9e; }

    #todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 12px 16px;
    }

    .todo-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: #3b82d4;
    }

    .todo-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .todo-title {
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .todo-title.completed {
      text-decoration: line-through;
      color: #57606a;
    }

    .todo-due-date {
      font-size: 0.8rem;
      color: #57606a;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .delete-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #57606a;
      font-size: 1.1rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }

    .delete-btn:hover { color: #cf222e; background: #fff0f0; }

    .empty-state {
      text-align: center;
      color: #57606a;
      font-size: 0.9rem;
      padding: 32px 0;
    }

    .error-banner {
      background: #fff0f0;
      border: 1px solid #f5a0a0;
      color: #cf222e;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.875rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todo</h1>
    <div id="error-banner" class="error-banner" role="alert"></div>
    <form class="add-form" id="add-form">
      <input
        type="text"
        id="todo-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        required
      />
      <input
        type="date"
        id="todo-due-date"
        aria-label="Target completion date"
      />
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
  </div>

  <script>
    const list = document.getElementById('todo-list');
    const form = document.getElementById('add-form');
    const input = document.getElementById('todo-input');
    const dueDateInput = document.getElementById('todo-due-date');
    const errorBanner = document.getElementById('error-banner');

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }

    function clearError() {
      errorBanner.textContent = '';
      errorBanner.style.display = 'none';
    }

    async function fetchTodos() {
      clearError();
      let todos;
      try {
        const res = await fetch('/todos');
        if (!res.ok) throw new Error('Failed to load todos');
        todos = await res.json();
      } catch {
        showError('Could not load todos. Is the server running?');
        return;
      }
      renderTodos(todos);
    }

    function renderTodos(todos) {
      list.innerHTML = '';
      if (todos.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty-state';
        li.textContent = 'No todos yet. Add one above!';
        list.appendChild(li);
        return;
      }
      for (const todo of todos) {
        const li = document.createElement('li');
        li.className = 'todo-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.setAttribute('aria-label', `Mark "${todo.title}" as ${todo.completed ? 'incomplete' : 'complete'}`);
        checkbox.addEventListener('change', () => toggleTodo(todo.id, checkbox.checked));

        const contentDiv = document.createElement('div');
        contentDiv.className = 'todo-content';

        const span = document.createElement('span');
        span.className = 'todo-title' + (todo.completed ? ' completed' : '');
        span.textContent = todo.title;
        contentDiv.appendChild(span);

        if (todo.due_date) {
          const dueSpan = document.createElement('span');
          dueSpan.className = 'todo-due-date';
          dueSpan.textContent = `📅 Due: ${todo.due_date}`;
          contentDiv.appendChild(dueSpan);
        }

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '✕';
        deleteBtn.setAttribute('aria-label', `Delete "${todo.title}"`);
        deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

        li.appendChild(checkbox);
        li.appendChild(contentDiv);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      }
    }

    async function addTodo(title, dueDate) {
      clearError();
      try {
        const payload = { title };
        if (dueDate) {
          payload.due_date = dueDate;
        }
        const res = await fetch('/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error('Failed to add todo');
      } catch {
        showError('Could not add todo. Please try again.');
        return;
      }
      await fetchTodos();
    }

    async function toggleTodo(id, completed) {
      clearError();
      try {
        const res = await fetch(`/todos/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed }),
        });
        if (!res.ok) throw new Error('Failed to update todo');
      } catch {
        showError('Could not update todo. Please try again.');
      }
      await fetchTodos();
    }

    async function deleteTodo(id) {
      clearError();
      try {
        const res = await fetch(`/todos/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to delete todo');
      } catch {
        showError('Could not delete todo. Please try again.');
        return;
      }
      await fetchTodos();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      const dueDate = dueDateInput.value || null;
      input.value = '';
      dueDateInput.value = '';
      await addTodo(title, dueDate);
    });

    document.addEventListener('DOMContentLoaded', fetchTodos);
  </script>
</body>
</html>
